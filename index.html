<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Comparison Dashboard</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --border: #e3e6eb;
    --text: #1c1e21;
    --muted: #6b7280;
    --green: #16a34a;
    --red: #dc2626;
    --amber: #d97706;
    --blue: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
  }
  header h1 { margin: 0 0 4px 0; font-size: 20px; }
  header .meta { color: var(--muted); font-size: 13px; }
  .stats {
    display: flex;
    gap: 16px;
    padding: 16px 24px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    min-width: 140px;
    flex: 1;
  }
  .stat-card .num { font-size: 22px; font-weight: 700; }
  .stat-card .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .controls {
    padding: 0 24px 12px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .controls input, .controls select {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
  }
  .controls input { flex: 1; min-width: 200px; }
  table-wrap { display: block; }
  .table-wrap {
    margin: 0 24px 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
  th {
    background: #fafbfc;
    font-size: 12px;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.03em;
  }
  tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.us { background: #dcfce7; color: var(--green); }
  .badge.competitor { background: #fee2e2; color: var(--red); }
  .badge.same { background: #fef3c7; color: var(--amber); }
  .badge.na { background: #f1f5f9; color: var(--muted); }
  .status-only_us { color: var(--blue); font-weight: 600; }
  .status-only_competitor { color: var(--amber); font-weight: 600; }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .loading { text-align: center; padding: 60px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>📊 Price Comparison Dashboard</h1>
  <div class="meta" id="meta">Loading...</div>
</header>

<div class="stats" id="stats"></div>

<div class="controls">
  <input type="text" id="search" placeholder="Product search karein...">
  <select id="filter">
    <option value="all">Sab dikhayein</option>
    <option value="matched">Sirf matched products</option>
    <option value="cheaper_us">Jahan hum sasty hain</option>
    <option value="cheaper_competitor">Jahan competitor sasta hai</option>
    <option value="only_us">Sirf hamare pass</option>
    <option value="only_competitor">Sirf competitor ke pass</option>
  </select>
</div>

<div class="table-wrap">
  <table id="results-table">
    <thead>
      <tr>
        <th>Product</th>
        <th>Humari Price</th>
        <th>Competitor Price</th>
        <th>Farak</th>
        <th>Sasta Kaun</th>
        <th>Match %</th>
      </tr>
    </thead>
    <tbody id="results-body">
      <tr><td colspan="6" class="loading">Data load ho raha hai...</td></tr>
    </tbody>
  </table>
</div>

<script>
let allResults = [];
let meta = {};

async function loadData() {
  try {
    const res = await fetch('comparison.json?t=' + Date.now());
    const data = await res.json();
    meta = data;
    allResults = data.results || [];
    render();
  } catch (e) {
    document.getElementById('meta').textContent = 'Data load nahi ho saka. Pehle script chala kar comparison.json banayein.';
    document.getElementById('results-body').innerHTML =
      '<tr><td colspan="6" class="empty-state">Abhi tak koi comparison data available nahi hai.</td></tr>';
  }
}

function fmtPrice(p) {
  if (p === null || p === undefined) return '—';
  return p.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function badge(cheaper) {
  if (cheaper === 'us') return '<span class="badge us">Hum</span>';
  if (cheaper === 'competitor') return '<span class="badge competitor">Competitor</span>';
  if (cheaper === 'same') return '<span class="badge same">Barabar</span>';
  return '<span class="badge na">—</span>';
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const filter = document.getElementById('filter').value;

  let rows = allResults.filter(r => r.product_name.toLowerCase().includes(search));

  if (filter === 'matched') rows = rows.filter(r => r.status === 'matched');
  if (filter === 'cheaper_us') rows = rows.filter(r => r.cheaper === 'us');
  if (filter === 'cheaper_competitor') rows = rows.filter(r => r.cheaper === 'competitor');
  if (filter === 'only_us') rows = rows.filter(r => r.status === 'only_us');
  if (filter === 'only_competitor') rows = rows.filter(r => r.status === 'only_competitor');

  const updated = meta.last_updated ? new Date(meta.last_updated).toLocaleString() : '—';
  document.getElementById('meta').textContent =
    `${meta.my_store_name || 'Hamari Store'} vs ${meta.competitor_name || 'Competitor'} — Last updated: ${updated}`;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="num">${meta.total_my_products ?? 0}</div><div class="label">Hamare Products</div></div>
    <div class="stat-card"><div class="num">${meta.total_competitor_products ?? 0}</div><div class="label">Competitor Products</div></div>
    <div class="stat-card"><div class="num">${meta.matched_count ?? 0}</div><div class="label">Matched</div></div>
    <div class="stat-card"><div class="num">${allResults.filter(r => r.cheaper === 'us').length}</div><div class="label">Hum Sasty</div></div>
    <div class="stat-card"><div class="num">${allResults.filter(r => r.cheaper === 'competitor').length}</div><div class="label">Competitor Sasta</div></div>
  `;

  if (rows.length === 0) {
    document.getElementById('results-body').innerHTML =
      '<tr><td colspan="6" class="empty-state">Koi result nahi mila.</td></tr>';
    return;
  }

  document.getElementById('results-body').innerHTML = rows.map(r => `
    <tr class="status-${r.status}">
      <td>${r.product_name}${r.status === 'only_us' ? ' <span style="color:#2563eb;font-size:11px;">(sirf hum)</span>' : ''}${r.status === 'only_competitor' ? ' <span style="color:#d97706;font-size:11px;">(sirf competitor)</span>' : ''}</td>
      <td>${fmtPrice(r.my_price)}</td>
      <td>${fmtPrice(r.competitor_price)}</td>
      <td>${r.price_diff !== null && r.price_diff !== undefined ? fmtPrice(Math.abs(r.price_diff)) : '—'}</td>
      <td>${badge(r.cheaper)}</td>
      <td>${r.match_confidence ? r.match_confidence + '%' : '—'}</td>
    </tr>
  `).join('');
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('filter').addEventListener('change', render);

loadData();
</script>

</body>
</html>
