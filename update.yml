name: Price Comparison Update

on:
  schedule:
    # Har ghante chalega (UTC time)
    - cron: '0 * * * *'
  workflow_dispatch: {}   # Manual "Run workflow" button ke liye bhi

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies install karo
        run: pip install requests beautifulsoup4 rapidfuzz

      - name: Shopify products fetch karo
        run: python scripts/fetch_shopify.py

      - name: Competitor products fetch karo
        run: python scripts/fetch_competitor.py

      - name: Compare karo
        run: python scripts/compare.py

      - name: Results commit karo
        run: |
          git config user.name "price-compare-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/comparison.json
          git diff --staged --quiet || git commit -m "Auto-update: price comparison"
          git push
